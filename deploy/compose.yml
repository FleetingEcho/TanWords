name: tanwords

services:
  app:
    # Built on the developer machine and loaded on the server. This Compose
    # file intentionally has no `build:` section: production never compiles.
    image: tanwords-web:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TANWORDS_HOST: 0.0.0.0
      TANWORDS_PORT: 8740
      TANWORDS_DATA_DIR: /data
      # Safe because port 8740 is not published and only Caddy can reach it.
      TANWORDS_TRUST_PROXY: 1
      # Needed to build the connection string shown for a user's self-hosted
      # Postgres remote access (server/postgres_remote/mod.rs). Same value
      # Caddy already gets.
      TANWORDS_PUBLIC_HOST: ${TANWORDS_PUBLIC_HOST:?set TANWORDS_PUBLIC_HOST in deploy/.env}
      # Admin connection to the shared `postgres` service below, used only to
      # provision/rotate per-user roles and databases
      # (server/postgres_remote/mod.rs) — never handed to end users.
      TANWORDS_POSTGRES_HOST: postgres
      TANWORDS_POSTGRES_PORT: 5432
      TANWORDS_POSTGRES_SUPERUSER_PASSWORD: ${TANWORDS_POSTGRES_SUPERUSER_PASSWORD:?set TANWORDS_POSTGRES_SUPERUSER_PASSWORD in deploy/.env}
    volumes:
      - tanwords-data:/data
    expose:
      - "8740"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8740/"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

  postgres:
    # Shared Postgres instance backing both `app`'s own optional Postgres
    # storage mode and every user's self-provisioned role+database (Settings
    # > Cloud tab > Postgres, enabled via server/postgres_remote/mod.rs).
    # Built locally from Dockerfile.postgres and loaded like `app` — no
    # `build:` section, production never compiles.
    image: tanwords-postgres:latest
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${TANWORDS_POSTGRES_SUPERUSER_PASSWORD:?set TANWORDS_POSTGRES_SUPERUSER_PASSWORD in deploy/.env}
    volumes:
      - tanwords-postgres-data:/var/lib/postgresql/data
    ports:
      # Published directly — remote clients (desktop app, psql, etc.) connect
      # straight to Postgres over its own TLS, not proxied through Caddy.
      - "5432:5432"
    expose:
      - "5432"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

  caddy:
    image: caddy:2.11.3-alpine
    restart: unless-stopped
    environment:
      TANWORDS_PUBLIC_HOST: ${TANWORDS_PUBLIC_HOST:?set TANWORDS_PUBLIC_HOST in deploy/.env}
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  tanwords-data:
    name: tanwords-data
  tanwords-postgres-data:
    name: tanwords-postgres-data
  caddy-data:
    name: tanwords-caddy-data
  caddy-config:
    name: tanwords-caddy-config
