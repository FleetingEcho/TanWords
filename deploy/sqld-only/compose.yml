name: tanwords-sqld

services:
  sqld:
    # A self-hosted libsql/sqld primary a TanWords desktop app connects to
    # directly (Settings > Cloud tab) as a remote database over the libsql
    # wire protocol — independent of the full app deployment (deploy/compose.yml)
    # and its web-app account system; this stack has no `app` service at all.
    image: ghcr.io/tursodatabase/libsql-server:latest
    restart: unless-stopped
    environment:
      SQLD_NODE: primary
      SQLD_AUTH_JWT_KEY_FILE: /etc/sqld/jwt.pub
    volumes:
      - sqld-data:/var/lib/sqld
      - ./sqld/jwt.pub:/etc/sqld/jwt.pub:ro
    expose:
      - "8080"
    security_opt:
      - no-new-privileges:true
    # This upstream image's entrypoint needs root-level filesystem
    # capabilities to initialize /var/lib/sqld on first run (observed:
    # dropping ALL capabilities makes it fail with "mkdir: cannot create
    # directory 'iku.db': Permission denied"), so cap_drop is intentionally
    # omitted here.

  caddy:
    image: caddy:2.11.3-alpine
    restart: unless-stopped
    environment:
      TANWORDS_PUBLIC_HOST: ${TANWORDS_PUBLIC_HOST:?set TANWORDS_PUBLIC_HOST in deploy/sqld-only/.env}
    ports:
      # 80 is only for the ACME HTTP-01 challenge Caddy uses to obtain the
      # cert for the 8443 vhost below — nothing is actually served on it.
      - "80:80"
      - "8443:8443"
      - "8443:8443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  sqld-data:
    name: tanwords-sqld-only-data
  caddy-data:
    name: tanwords-sqld-only-caddy-data
  caddy-config:
    name: tanwords-sqld-only-caddy-config
