# Every connection — internal (from `app`, over the compose bridge network)
# and external (a user's desktop/psql client on the published 5432 port) —
# is treated the same: password auth, TLS required. There is no plaintext
# `host` fallback, so this doubles as the "reject unencrypted" rule.
local   all             all                                     scram-sha-256
hostssl all             all             0.0.0.0/0               scram-sha-256
hostssl all             all             ::0/0                   scram-sha-256
host    all             all             0.0.0.0/0               reject
host    all             all             ::0/0                   reject
