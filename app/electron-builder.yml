# electron-builder config for TanWords (Electron migration, Task 5).
# Reference: docs/electron-migration-plan.md §6, docs/electron-migration-handoff.md
# Task 5, and electron_app/task1-csp-and-icons.md (values extracted from the old
# app/core/tauri.conf.json before it was deleted in Task 1).
#
# Kept as a separate YAML file rather than package.json's `build` key purely for
# readability given how much platform-specific config this needs; `bun run package`
# (package.json) invokes plain `electron-builder`, which auto-discovers this file.

appId: com.tanner.tanwords
productName: TanWords

# Keep only the UI languages the app actually ships. Electron's default
# framework ships ~220 locale packs (~47MB unpacked) for Chromium's built-in
# UI; removing every language except English and Simplified Chinese is the
# largest single installer-size lever left after node_modules exclusion.
electronLanguages:
  - en
  - zh_CN

# ---------------------------------------------------------------------------
# Update feed. Without this block electron-builder emits no `app-update.yml`
# into the package, so `autoUpdater.checkForUpdates()` throws at runtime,
# electron/main/updater.ts swallows it as "no update available", and the app
# reports itself up to date forever. The Tauri config this replaced pointed at
# the same repo's releases:
#   https://github.com/FleetingEcho/TanWords/releases/latest/download/latest.json
# The github provider is the direct equivalent — it publishes `latest-mac.yml`
# / `latest.yml` / `latest-linux.yml` next to the artifacts and bakes the
# matching app-update.yml into the build.
#
# NOTE (migration plan §10.2): installs from the Tauri-era 1.0.0 will NOT pick
# this up. They check the old minisign-signed latest.json and have no code path
# to electron-updater, so they need a manual reinstall once. Nothing here can
# change that — it only matters that new builds update from here on.
#
# NOTE (macOS): electron-updater refuses to install an unsigned update on mac.
# The `mac.identity` / notarization setup must be in place for this to do
# anything on a real user's machine; an unsigned local build will download and
# then fail to apply.
publish:
  provider: github
  owner: FleetingEcho
  repo: TanWords
# version is NOT set here — electron-builder reads it from package.json's
# "version" (already 1.0.0); duplicating it here would be a second source of truth.

directories:
  # The Vite build output (out/main, out/preload, out/renderer) is what
  # actually ships; core/ (Rust source + target/) and src/ (pre-bundle renderer
  # source) must NOT be swept into the app via the default "**/*" file matcher.
  output: ../dist-releases
  buildResources: build

files:
  - out/**/*
  - package.json
  # Everything else (src/, electron/ *.ts sources, core/ Rust source & target/,
  # docs/, scripts/) is excluded by omission — `files` replaces the default
  # "**/*" glob once specified.
  #
  # node_modules has to be excluded explicitly, though: electron-builder adds
  # production dependencies on its own, tracked from package.json's
  # "dependencies" rather than from this list. Every one of those 30 packages
  # is a renderer library (React, Mantine, BlockNote, mermaid, date-fns…) that
  # Vite has already bundled into out/renderer, and vite-plugin-electron inlines
  # one main-process dependency (electron-updater) straight into
  # out/main/index.js — there is no `require` left for any of it to resolve.
  # Shipping the tree as well made app.asar 344MB instead of 18MB.
  - "!node_modules/**/*"
asarUnpack: []

# ---------------------------------------------------------------------------
# extraResources: the tanwords-core sidecar. Destination `core/tanwords-core`
# matches EXACTLY what electron/main/sidecar.ts's resolveBinaryPath() looks up
# when app.isPackaged:
#   path.join(process.resourcesPath, "core", name)
#
# The sidecar used to be accompanied by a per-platform `sherpa-libs` payload of
# sherpa-onnx/onnxruntime shared libraries, positioned to match an rpath baked
# in by app/core/build.rs. The `sherpa-onnx` crate links those statically, so
# the binary is self-contained and none of that staging exists any more.
# ---------------------------------------------------------------------------
extraResources:
  - from: core/target/release/tanwords-core
    to: core/tanwords-core
  # The window icon, read at runtime by electron/main/index.ts. mac.icon /
  # win.icon / linux.icon above only dress the *bundle*; a BrowserWindow on
  # Linux still needs a real file it can load, and `files` deliberately keeps
  # all of core/ out of the app, so ship this one PNG explicitly.
  - from: core/icons/icon.png
    to: icon.png
  # The menu-bar/tray icon, resolved at runtime by tray.ts's trayIconPath().
  # Separate from the icons above: those dress the bundle, this one is loaded
  # as a file by nativeImage. The @2x variant is never referenced by name —
  # nativeImage picks it up automatically from the 1x path — but it has to sit
  # beside it, or the icon renders upscaled and soft on a retina display.
  - from: core/icons/tray-template.png
    to: tray-template.png
  - from: core/icons/tray-template@2x.png
    to: tray-template@2x.png
  # Linux tray: the status-notifier host shows raw pixels (no template
  # recolouring), so tray.ts's trayIconPath() swaps in this white variant —
  # panels are overwhelmingly dark and the black template shape is invisible.
  - from: core/icons/tray-template-white.png
    to: tray-template-white.png
  - from: core/icons/tray-template-white@2x.png
    to: tray-template-white@2x.png

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  icon: core/icons/icon.icns
  category: public.app-category.education
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # electron-builder's default deep-sign covers the .app bundle and its Node
  # native addons, but a plain Mach-O executable dropped into Resources via
  # extraResources is NOT reliably picked up by that pass with the right
  # entitlements/hardened-runtime flags — list it explicitly so it gets signed
  # with the same identity + entitlements as the app itself. electron-builder
  # docs describe `mac.binaries` paths as relative to the built app's
  # Contents/Resources/ directory (see extraResources above: the binary lands
  # at Contents/Resources/core/tanwords-core, so "core/tanwords-core" here).
  # UNVERIFIED: no macOS signing environment available in this sandbox to
  # confirm electron-builder actually resolves/signs this path as expected —
  # see the packaging report for what still needs a real Mac to check.
  binaries:
    - core/tanwords-core

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
    - target: rpm
      arch: [x64]
  # electron-builder expects a directory of <size>x<size>.png files for the
  # Linux icon set; app/core/icons/ has 32x32.png/64x64.png/128x128.png
  # alongside unrelated files (Windows Square*Logo.png, android/, ios/,
  # icon.png, tray-template.png) that electron-builder simply ignores because
  # they don't match its <N>x<N>.png naming pattern.
  icon: core/icons
  category: Education

# AppImage has no equivalent of Tauri's `bundle.linux.bundleMediaFramework`
# (which bundled GStreamer's own codec plugins into the AppImage so it didn't
# depend on the host's GStreamer install). electron-builder's AppImage target
# does not offer this — TODO(manual verification): test audio playback
# (native_audio_* + TTS) on a plain AppImage launch on a machine WITHOUT
# gstreamer1.0-plugins-{good,bad,ugly} installed, since deb/rpm depends below
# won't help an AppImage user. Plan §9.5 / electron_app/task1-csp-and-icons.md.
deb:
  # electron-builder's fpm-based deb/rpm targets require a maintainer with a
  # name+email (normally taken from package.json's "author" field, which this
  # project doesn't set). Setting it directly here avoids inventing a fake
  # author identity in package.json — replace with a real
  # "Name <email>" before shipping an actual release.
  maintainer: FleetingEcho <dev2jake@gmail.com>
  depends:
    - gstreamer1.0-plugins-good
    - gstreamer1.0-plugins-bad
    - gstreamer1.0-plugins-ugly
    # speech-dispatcher: plan §9.5 — Chromium's window.speechSynthesis
    # (ttsBackend.ts's fallback when no embedded TTS model is loaded) returns
    # an empty voice list on Linux without speech-dispatcher running.
    - speech-dispatcher

rpm:
  maintainer: FleetingEcho <dev2jake@gmail.com>
  depends:
    - gstreamer1-plugins-good
    - gstreamer1-plugins-bad-free
    - gstreamer1-plugins-ugly-free
    - speech-dispatcher

win:
  target:
    - target: nsis
      arch: [x64]
  icon: core/icons/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
