[package]
name = "tanwords"
version = "1.2.0"
description = "TanWords - AI-powered English learning assistant"
authors = ["Tanner"]
edition = "2021"

[lib]
name = "tanwords_lib"
crate-type = ["rlib"]

[[bin]]
name = "tanwords-core"
path = "src/main.rs"

[build-dependencies]
# Used by generate_dispatch_table() in build.rs to scan src/ for
# `#[crate::shim::command]`-annotated functions and generate dispatch.rs.
regex = "1"

[dependencies]
tanwords-macros = { path = "macros" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# One API for both connection profiles: a plain local SQLite file, and a
# Turso embedded replica (local file + background sync to the user's primary).
libsql = "0.9.30"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
aes-gcm = "0.10"
argon2 = "0.5"
sha2 = "0.10"
rand = "0.8"
dirs = "5"
reqwest = { version = "0.12", features = ["gzip", "brotli", "stream"] }
dom_smoothie = "0.18"
ammonia = "4"
rs-fsrs = "1"
chrono = "0.4"
# k2-fsa's own binding, not the third-party `sherpa-rs` wrapper we used to
# depend on: that crate stalled at sherpa-onnx's older C API and only ever
# exposed vits/matcha/kokoro/kitten, so pocket/supertonic/zipvoice were
# unreachable. This one tracks upstream and links statically, which is why
# build.rs no longer has to stage any dylibs.
sherpa-onnx = "1.13.4"
tar = "0.4"
bzip2 = "0.4"
futures-util = "0.3"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
libloading = "0.8"
feed-rs = "2"
url = "2"
lofty = "0.22"
rodio = { version = "0.22.2", default-features = false, features = ["playback", "mp3", "flac", "vorbis", "wav", "mp4"] }
# Used directly (not through rodio) by native_audio::robust, which needs
# packet-level control rodio's Decoder does not expose: pinning the audio track
# in a container that also has video, and recovering from mid-file demuxer
# errors instead of ending the stream. Same crate versions rodio already
# resolves to, so this adds no extra compilation.
symphonia = { version = "0.5.5", default-features = false, features = ["mp3", "aac", "isomp4", "flac", "vorbis", "ogg", "wav", "pcm", "adpcm", "alac", "mkv", "aiff", "caf"] }
walkdir = "2"
encoding_rs = "0.8"
ignore = "0.4.30"
grep-searcher = "0.1.17"
grep-regex = "0.1.14"
tokio = { version = "1", features = ["net", "rt-multi-thread", "sync", "macros", "io-std", "io-util", "signal"] }
tokio-util = "0.7"
tokio-stream = { version = "0.1", features = ["sync"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors"] }
rmcp = { version = "0.16", features = ["server", "transport-streamable-http-server"] }
schemars = "1"
zip = { version = "4.6.1", default-features = false, features = ["deflate"] }
regex = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
