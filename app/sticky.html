<!DOCTYPE html>
<html lang="en">
  <head>
    <script>
      // Same last-known-theme flash prevention as index.html and
      // sticky-manager.html — the sticky note follows the app theme: light
      // themes keep the classic full-pastel note, dark themes tint the
      // themed canvas toward the note's hue (see --sticky-tint/--sticky-ink
      // in theme-vars.css). Shiki also keys off the "dark" class via
      // codeBlockShiki, so code blocks pick the matching syntax theme.
      (function () {
        try {
          var theme = localStorage.getItem("tanwords_theme_cache") || "system";
          var isDark =
            theme === "dark" || theme === "catppuccin-mocha" || theme === "dracula" ||
            theme === "tokyo-night" || theme === "tokyo-night-storm" || theme === "dim" ||
            (theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (isDark) document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = isDark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
    <style>
      /* The OS window is transparent — only the note surface inside paints.
         overflow:hidden for the same sub-pixel-scrollbar reason as
         floating-browser.html (a scrollbar here would shrink the visible
         surface and show the desktop through the gap). */
      html, body, #root { min-height: 100%; margin: 0; background: transparent; overflow: hidden; }
      /* Default ink on the note surface: near-black on pastel in light
         themes, the theme's foreground in dark ones (--sticky-ink flips in
         theme-vars.css). #root gives this specificity over the shared
         .tanwords-tiptap .ProseMirror rule (var(--foreground)), whatever
         order the bundles load in; user-chosen TextStyle marks are inline
         styles and still win over this default. */
      #root .tanwords-tiptap .ProseMirror { color: var(--sticky-ink, #1f2937); }
    </style>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>TanNotes Sticky</title>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/stickyWindowMain.tsx"></script>
  </body>
</html>
