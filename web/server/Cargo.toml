[package]
name = "tanwords-web-server"
version = "0.1.0"
edition = "2021"
publish = false
description = "TanWords web backend - serves the SPA and the core command API over the network"

# Standalone crate on purpose: its own Cargo.lock and target dir, so the
# desktop build under app/core (electron sidecar) is untouched by whatever
# happens here. The core is consumed as a library with desktop features off —
# no sherpa-onnx / rodio / symphonia in this binary.
[dependencies]
tanwords_lib = { package = "tanwords", path = "../../app/core", default-features = false, features = ["web"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "sync", "time", "fs", "io-util"] }
axum = { version = "0.8", features = ["multipart"] }
tower-http = { version = "0.6", features = ["fs", "compression-br", "compression-gzip"] }
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
reqwest = { version = "0.12", features = ["stream"] }
url = "2"
lol_html = "3"
argon2 = "0.5"
aes-gcm = "0.10"
sha2 = "0.10"
jsonwebtoken = "9"
libsql = "0.9.30"
rand = "0.8"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
dirs = "5"
rust-embed = "8"
